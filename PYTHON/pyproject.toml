[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curl-impersonate-runtime"
version = "0.1.0"
description = "Python API for the cURL Impersonate"
requires-python = ">=3.9"
dependencies = ["yarl>=1.9"]

[tool.setuptools.packages.find]
include = ["curl_impersonate*"]

[tool.setuptools.package-data]
curl_impersonate = [
    "bin/*.dll",
    "bin/*.ini",
    "bin/runtime/*/*.dll",
    "bin/runtime/*/*.bin",
    "bin/runtime/*/checksum",
]
